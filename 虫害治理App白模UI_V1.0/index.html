const iconPaths={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',tasks:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM8 12h8M8 16h5"/>',risk:'<path d="m12 3 10 18H2Z"/><path d="M12 9v5M12 17h.01"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',back:'<path d="m14 5-7 7 7 7"/>',chevron:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 5 5L20 7"/>',camera:'<path d="m8 5 1-2h6l1 2h5v15H3V5Z"/><circle cx="12" cy="12" r="4"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',sync:'<path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5M4 17a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/>',pin:'<path d="M19 9c0 6-7 12-7 12S5 15 5 9a7 7 0 0 1 14 0Z"/><circle cx="12" cy="9" r="2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',file:'<path d="M5 2h9l5 5v15H5Z"/><path d="M14 2v6h5M8 13h8M8 17h6"/>',shield:'<path d="m12 2 8 3v7c0 5-8 10-8 10S4 17 4 12V5Z"/><path d="m8 11 3 3 5-6"/>',wifi:'<path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 20h.01"/>',battery:'<rect x="2" y="6" width="18" height="12" rx="2"/><path d="M22 10v4M5 9h12v6H5Z"/>',signal:'<path d="M4 20v-4M9 20v-8M14 20V8M19 20V4"/>',device:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18M7 15h2M13 15h2"/>',logout:'<path d="M9 4H3v16h6M9 12h12m-4-4 4 4-4 4"/>',bell:'<path d="M5 17h14l-2-4V8a5 5 0 0 0-10 0v5ZM10 21h4"/>',edit:'<path d="m4 16 12-12 4 4L8 20H4ZM13 7l4 4"/>'};
const I=(name,cls='')=>`<svg class="${cls}" aria-hidden="true" viewBox="0 0 24 24">${iconPaths[name]||iconPaths.file}</svg>`;
const routes=[
['login','登录','账号与任务','员工登录与使用须知','首次登录需要联网；当前入口为原型演示。'],
['home','工作台','账号与任务','今日概览与快捷入口','优先展示待执行任务与待同步事项。'],
['tasks','任务列表','账号与任务','按日期和状态查找任务','常规、应急及复查任务共用列表。'],
['detail','任务详情','账号与任务','门店资料与分步作业入口','显示已完成、待填写和待确认状态。'],
['checkin','到店签到','现场作业','定位、门头照片与到店时间','定位异常允许说明原因；离线到店时间保留。'],
['intake','服务前确认','现场作业','服务须知、客户反馈与现场发现','不同虫情来源分别记录；不默认无异常。'],
['static','门店静态评估','现场作业','本次环境检查与上次结果对照','上次评估仅作参考，本次须主动确认。'],
['devices','设施点检列表','现场作业','逐点检查并记录覆盖情况','零捕获、未检查与无法确认分别记录。'],
['inspection','设施点检','现场作业','状态、耗材、捕获数量和照片','设施状态与耗材更换独立；捕获需关联处置。'],
['risks','风险台账','风险与防治','待整改、待复核及已关闭风险','风险跨服务延续，服务结束不自动关闭风险。'],
['riskdetail','整改跟进','风险与防治','查看风险并记录复核结果','支持整改照片、未核查原因和不通过退回。'],
['newrisk','新增风险','风险与防治','位置、证据、建议、责任和期限','有风险不等于有虫情，不要求虚构用药。'],
['treatment','防治措施','风险与防治','措施记录及条件性用药字段','首选实际措施，药剂参数由公司配置。'],
['summary','服务总结','确认与报告','完整性检查和总结核对','缺失必填项时指向对应页面补录。'],
['report','报告预览','确认与报告','客户确认前查看本次内容','预览至少5秒，再主动确认已阅读。'],
['staffsign','员工签字','确认与报告','核对信息并签署本次服务','签字绑定本次内容版本，修改后须重新确认。'],
['clientsign','客户确认','确认与报告','预览、姓名、可选评价和签字','缺席或拒签保持待确认；不预设满分。'],
['sync','同步中心','确认与报告','离线队列、失败重试与冲突处理','双签有效、附件完整、PDF成功后才发布。'],
['reportdone','正式报告','确认与报告','查看发布结果与未关闭风险','已发布报告不可覆盖，更正需新版本与双签。'],
['profile','我的','账号与任务','员工信息、离线资料与设置','账号隔离与缓存管理；未同步数据不能直接清理。']
];
const routeMap=Object.fromEntries(routes.map((r,i)=>[r[0],{id:r[0],title:r[1],group:r[2],desc:r[3],rule:r[4],index:i+1}]));
const saved=(()=>{try{return JSON.parse(localStorage.getItem('pest-wireframe-v1')||'{}')}catch{return {}}})();
let state={offline:false,downloaded:true,checkedIn:false,deviceSaved:false,riskSaved:false,staffSigned:false,customerSigned:false,published:false,rating:0,fields:{},...saved};
let route=(location.hash.slice(1)||'home');if(!routeMap[route])route='home';
let reportReturn='clientsign';let reviewed=false,reviewTimer=null,reviewRemaining=5,signatureDrawn=false,taskFilter='all',taskQuery='',riskFilter='all',deviceFilter='all';
const params=new URLSearchParams(location.search);const isGallery=params.has('gallery');const standalone=params.has('screen');let toastTimer;
function persist(){try{localStorage.setItem('pest-wireframe-v1',JSON.stringify(state))}catch{} }
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function action(label,act,cls='btn primary',extra=''){return `<button type="button" class="${cls}" data-act="${act}" ${extra}>${label}</button>`}
const goBtn=(label,id,cls='btn primary')=>action(label,'go:'+id,cls);
const tag=(text,cls='')=>`<span class="tag ${cls}">${text}</span>`;
const title=(text,right='')=>`<div class="section-title">${text}${right?`<small>${right}</small>`:''}</div>`;
const kv=(k,v)=>`<div class="text-row"><span>${k}</span><span>${v}</span></div>`;
const field=(label,key,value='',placeholder='',type='text')=>`<label class="field"><span>${label}</span><input class="input" type="${type}" data-field="${key}" value="${esc(state.fields[key]??value)}" placeholder="${esc(placeholder)}"></label>`;
const area=(label,key,value='',placeholder='请输入')=>`<label class="field"><span>${label}</span><textarea data-field="${key}" placeholder="${placeholder}">${esc(state.fields[key]??value)}</textarea></label>`;
function segment(label,key,options,current){const selected=state.fields[key]??current;return `<div class="field"><span>${label}</span><div class="segmented" role="group" aria-label="${label}">${options.map(o=>`<button type="button" class="${selected===o?'active':''}" aria-pressed="${selected===o}" data-seg="${key}" data-value="${o}">${o}</button>`).join('')}</div></div>`}
function select(label,key,options,current){return `<label class="field"><span>${label}</span><select data-field="${key}" aria-label="${label}">${options.map(v=>`<option ${v===(state.fields[key]??current)?'selected':''}>${v}</option>`).join('')}</select></label>`}
const photo=(label='现场照片',large=false)=>`<div class="photo ${large?'large':''}" role="img" aria-label="${label}占位图">${I('camera')}<span>${label}</span></div>`;
const addPhoto=(label='拍摄照片')=>`<button type="button" class="photo add" data-act="photo">${I('plus')}<span>${label}</span></button>`;
const photos=(labels=['现场照片'],add=true)=>`<div class="photo-row">${labels.map(l=>photo(l)).join('')}${add?addPhoto():''}</div>`;
const row=(icon,head,sub='',target='',right='')=>`<${target?'button type="button"':'div'} class="row" ${target?`data-act="go:${target}"`:''}><span class="square">${I(icon)}</span><span class="main"><strong>${head}</strong>${sub?`<small>${sub}</small>`:''}</span>${right||''}${target?I('chevron','chevron'):''}</${target?'button':'div'}>`;
function bottomnav(active){return `<nav class="bottomnav" aria-label="应用导航">${[['home','home','工作台'],['tasks','tasks','任务'],['risks','risk','风险'],['profile','user','我的']].map(([id,ic,t])=>`<button type="button" class="${active===id?'active':''}" data-act="go:${id}">${I(ic)}<span>${t}</span></button>`).join('')}</nav>`}
const cacheStrip=()=>`<div class="strip">${I(state.offline?'download':'check')}<span class="strip-text">${state.offline?'当前离线 · 记录已自动保存到本机':'任务资料已下载 · 可离线作业'}</span></div>`;
const serviceName=()=>`<div class="split"><strong style="font-size:15px">示例餐饮 · 万达店</strong>${tag('常规服务')}</div><p style="font-size:11px;color:#777;margin-top:8px">门店 4273 · 2026年11月11日</p>`;
function taskCard(name,time,status,place,cta='查看任务',type='常规服务'){return `<button type="button" class="task-card" data-act="go:detail"><div class="split"><span class="time">${time} · ${type}</span>${tag(status,status==='进行中'?'dark':'')}</div><h3>${name}</h3><p>${I('pin').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px"')} ${place}</p><div class="bottom"><span class="download-state">${I('download')} 资料已下载</span><span class="primary-link">${cta} ›</span></div></button>`}
function pillTabs(items,key,active){return `<div class="tabs">${items.map(([v,l])=>`<button type="button" class="${v===active?'active':''}" data-filter="${key}" data-value="${v}">${l}</button>`).join('')}</div>`}
function signature(kind,gallery){return `<div class="sign-wrap">${gallery?'<div class="signature"></div>':`<canvas class="signature" id="signature-canvas" width="700" height="360" aria-label="${kind}手写签字区域"></canvas>`}<div class="sign-guide" id="sign-guide">请在此处手写签名<span>签字将关联本次服务内容</span></div></div><div class="sign-labels"><span>内容版本 V1 · 本次服务</span>${action('清除签名','clear-sign','')}</div>`}
const pages={
login(g){return {title:'',body:`<div class="inner"><div class="login-logo">${I('shield')}</div><h2 class="login-title">虫控作业</h2><p class="login-sub">员工服务工作台</p><div class="login-form">${field('公司编号','company','PC001')}${field('员工账号','account','','请输入员工账号')}${field('密码','password','','请输入密码','password')}<label class="checkline"><input type="checkbox" checked data-field="terms"><span>我已阅读并同意使用须知与隐私说明</span></label>${action('进入工作台','login','btn primary full')}<div class="split" style="margin-top:16px">${action('联系管理员','help','btn text small')}<small>首次登录需联网</small></div></div><p class="login-bottom">仅限授权员工使用<br/>公司统一分配账号与门店权限</p></div>`,back:false}},
home(g){return {title:'工作台',right:action(I('bell'),'notice','icon-btn','aria-label="通知"'),body:`<div class="inner"><div class="split"><div><p class="muted" style="font-size:12px">11月11日 · 星期三</p><h2 style="font-size:24px;margin-top:7px;font-weight:600">早上好，陈工</h2></div><div class="avatar" style="width:42px;height:42px;font-size:16px">陈</div></div><div class="metrics"><div class="metric"><b>3</b><small>今日任务</small></div><div class="metric"><b>1</b><small>进行中</small></div><div class="metric"><b>${state.published?0:2}</b><small>待同步</small></div></div><button class="strip" style="width:100%;border-radius:5px;text-align:left" data-act="go:sync">${I('sync')}<span class="strip-text">${state.published?'全部记录已同步':'有2项记录待同步，现场资料已保留'}</span>${I('chevron','chevron')}</button><div class="quick">${[['tasks','calendar','全部任务'],['detail','plus','应急服务'],['risks','risk','风险跟进'],['sync','download','离线资料']].map(([r,ic,t])=>`<button data-act="${t==='应急服务'?'emergency':'go:'+r}"><span class="square">${I(ic)}</span>${t}</button>`).join('')}</div>${title('今日待办','3项任务')}${taskCard('示例餐饮 · 万达店','09:00—10:00','进行中','江阴市 · 万达广场','继续作业')}${taskCard('示例餐饮 · 中山店','14:00—15:00','待执行','江阴市 · 中山路','开始服务')}${title('需要关注','2项')}<div class="panel" style="padding:0 14px">${row('risk','2条风险即将到期','万达店 · 建筑结构风险','risks')}</div></div>`,nav:'home',back:false}},
tasks(g){const all=[['示例餐饮 · 万达店','09:00—10:00','进行中','江阴市 · 万达广场','继续作业','常规服务'],['示例餐饮 · 中山店','14:00—15:00','待执行','江阴市 · 中山路','查看任务','常规服务'],['示例商超 · 城东店','16:00—17:00','待执行','江阴市 · 城东路','查看任务','整改复查']];const filtered=all.filter(v=>(taskFilter==='all'||v[2]===taskFilter)&&v[0].includes(taskQuery));return {title:'我的任务',right:action(I('plus'),'emergency','icon-btn','aria-label="新增应急服务"'),body:`<div class="date-strip">${['一','二','三','四','五','六','日'].map((d,i)=>`<button class="day ${i===2?'current':''}" data-act="day:${i}">${d}<b>${9+i}</b></button>`).join('')}</div>${pillTabs([['all','全部 3'],['待执行','待执行 2'],['进行中','进行中 1'],['已完成','已完成']], 'task',taskFilter)}<div class="inner"><label class="search">${I('search')}<input id="task-search" aria-label="搜索门店" placeholder="搜索门店名称或编号" value="${esc(taskQuery)}"></label><div id="task-results">${filtered.length?filtered.map(v=>taskCard(...v)).join(''):`<div class="empty-state">${I('tasks')}<h3>暂无相关任务</h3><p>可以切换日期或任务状态</p></div>`}</div></div>`,nav:'tasks',back:false}},
detail(g){const steps=[['checkin','到店签到',state.checkedIn?'已完成':'待填写','门头照片与到店位置'],['intake','服务前确认','已完成','服务须知与客户反馈'],['static','门店静态评估','待确认','本次环境情况'],['devices','设施维护','3 / 9','逐个检查并拍照'],['risks','检测与风险跟进','2 / 7','历史风险逐条复核'],['treatment','防治措施','待填写','清洁、封堵、物理或用药'],['summary','总结与签字','待完成','核对内容，双方现场确认']];return {title:'服务任务',body:`${cacheStrip()}<div class="inner"><div class="panel">${serviceName()}${kv('计划时间','09:00—10:00')}${kv('门店地址','万达广场47号')}${kv('现场联系人','李店长 · 138****0000')}<div class="progress"><span style="width:38%"></span></div><small>本次作业进度 3 / 8</small></div><div class="split" style="margin:18px 0 4px"><strong style="font-size:15px">作业步骤</strong><small>建议服务 ≥ 30分钟</small></div><div class="panel" style="padding:0 14px">${steps.map(([id,t,s,sub],i)=>`<button class="row" data-act="go:${id}"><span class="circle ${s==='已完成'?'done':''}">${s==='已完成'?I('check'):i+1}</span><span class="main"><strong>${t}</strong><small>${sub}</small></span>${tag(s)}${I('chevron','chevron')}</button>`).join('')}</div></div>`,footer:goBtn('继续作业','checkin'),back:'tasks'}},
checkin(g){return {title:'到店签到',body:`<div class="inner">${serviceName()}<div class="map" style="margin-top:18px"><div class="pin">${I('pin')}</div><span class="maplabel">示例位置 · 门店签到范围</span></div><div class="text-row"><span>定位结果</span><span>距门店 28米 · 精度 ±12米</span></div>${title('门头照片','至少1张')}<div class="photo-row">${photo('门头照片',true)}</div>${action('重新拍摄','photo','btn full')}${title('签到信息')}${kv('服务人员','陈工')}${kv('到店时间','2026-11-11 09:06')}${select('定位情况','location',['范围内','超出范围','无法定位'],'范围内')}${area('异常说明（定位异常时填写）','locReason','','请说明现场情况')}<p class="hint">离线签到保留实际到店时间，联网后自动上传。</p></div>`,footer:action(state.checkedIn?'已签到 · 继续服务':'确认签到','checkin'),back:'detail'}},
intake(g){return {title:'服务前确认',body:`<div class="inner"><div class="panel"><h2>服务须知</h2><p>确认个人防护、现场沟通与食品保护措施。了解门店近期虫害反馈后开始检查。</p><label class="checkline"><input type="checkbox" checked data-field="noticeRead"><span>已阅读并完成服务前沟通</span></label></div>${title('客户反馈','独立记录来源')}${segment('近期是否发现虫害','feedback',['未询问','未发现','有发现'],'有发现')}${select('虫害类型','feedbackPest',['鼠类','蟑螂','飞虫','其他'],'飞虫')}${field('发现区域','feedbackArea','后厨清洁池')}${area('反馈描述','feedbackText','店员反馈近一周清洁池附近有飞虫活动，数量约15只。')}${title('现场发现')}${segment('现场是否发现虫体或虫迹','onsite',['未检查','未发现','有发现'],'未检查')}<p class="hint">客户反馈、现场发现与设施捕获分别记录，不自动相加。</p></div>`,footer:action('保存并继续','save:static'),back:'detail'}},
static(g){return {title:'门店静态评估',body:`<div class="strip">${I('clock')}<span class="strip-text">参考上次评估：2026-10-11 · 请确认本次情况</span></div><div class="inner">${segment('门店类型','storeType',['封闭式','开放式'],'封闭式')}${segment('卷帘门 / 折叠门','shutter',['有','无'],'无')}${segment('风幕机状态','air',['开启','未开启','无设备'],'未开启')}${segment('风幕机出风角度','angle',['符合','不符合','不适用'],'不符合')}${segment('开放式吊顶','ceiling',['有','无'],'无')}${field('周边污水井数量','well','1','','number')}${segment('周边装修 / 空置商铺','neighbor',['有','无'],'有')}${title('现场照片')}${photos(['门店环境'])}<label class="checkline"><input type="checkbox" checked data-field="staticConfirm"><span>已核对本次环境情况，结果与当前现场一致</span></label></div>`,footer:action('保存本次评估','save:devices'),back:'detail'}},
devices(g){const rows=[['I0001','灭蝇灯','后区 · 清洁池','已检查','飞虫 3 · 其他 12'],['I0002','灭蝇灯','后区 · 配电柜','待检查','等待本次点检'],['G0001','粘鼠板','后区 · 天花板','已检查','鼠类 0 · 状态正常'],['G0002','粘鼠板','后区 · 洗手池上方','待检查','等待本次点检'],['C0001','蟑螂监测器','后区 · 水池底部','已检查','蟑螂 0 · 状态正常']].filter(v=>deviceFilter==='all'||v[1]===deviceFilter);return {title:'设施维护',right:action('新增','new-device','link-action'),body:`<div class="inner" style="padding-bottom:8px"><div class="split"><div><strong style="font-size:25px">3 <span style="font-size:13px;color:#888;font-weight:400">/ 9 已检查</span></strong></div>${tag('6项待检查')}</div><div class="progress"><span style="width:33%"></span></div><p class="hint">逐个点检并拍照，未检查需说明原因。</p></div>${pillTabs([['all','全部'],['灭蝇灯','灭蝇灯'],['粘鼠板','粘鼠板'],['蟑螂监测器','蟑螂设施']],'device',deviceFilter)}<div class="inner">${rows.map(v=>`<button class="task-card" data-act="go:inspection"><div class="split"><strong style="font-size:14px">${v[0]} · ${v[1]}</strong>${tag(v[3])}</div><p>${v[2]}</p><div class="bottom"><span>${v[4]}</span>${I('chevron','chevron')}</div></button>`).join('')}</div>`,footer:goBtn('返回作业清单','detail','btn'),back:'detail'}},
inspection(g){return {title:'设施点检',body:`<div class="inner"><div class="panel"><div class="split"><h2>I0001 · 灭蝇灯</h2>${tag('在用')}</div><p>后区 · 一层清洁池上方</p></div>${segment('检查结果','checkStatus',['已检查','未检查','无法确认'],'已检查')}${segment('设施状态','deviceStatus',['正常','损坏','缺失'],'正常')}${segment('耗材更换','replace',['未更换','已更换'],'已更换')}${title('捕获数量','按虫种分别填写')}<div class="number-grid">${[['flies','蝇类','1'],['smallflies','果蝇 / 蚤蝇 / 蛾蠓','2'],['otherbugs','其他','12']].map(([k,l,v])=>`<label class="field"><span>${l}</span><div class="stepper"><button type="button" data-step="${k}:-1" aria-label="减少${l}">−</button><input type="number" min="0" data-field="${k}" value="${state.fields[k]??v}" aria-label="${l}数量"><button type="button" data-step="${k}:1" aria-label="增加${l}">+</button></div></label>`).join('')}</div>${title('本次检查照片','至少1张')}${photos(['点检前','更换后'])}<div class="strip">${I('risk')}<span class="strip-text">已记录捕获，请关联处置措施或未处置原因。</span></div>${goBtn('关联防治措施','treatment','btn full small')}<p class="hint">未检查或无法确认时填写原因，不计为零捕获。</p></div>`,footer:action('保存点检','device-save'),back:'devices'}},
risks(g){const items=[['建筑结构','穿墙孔洞封堵不严','后区 · 三楼','待整改','11月13日前'],['卫生清洁','设备底部积存残渣','后区 · 清洁池','待复核','已提交改善照片'],['建筑结构','天花板盖板未盖严','后区 · 油烟机上方','整改中','11月15日前']].filter(v=>riskFilter==='all'||v[3]===riskFilter);return {title:'风险台账',right:goBtn('新增','newrisk','link-action'),body:`${pillTabs([['all','全部 7'],['待整改','待整改 4'],['待复核','待复核 1'],['已关闭','已关闭']],'risk',riskFilter)}<div class="inner"><div class="split" style="margin-bottom:15px"><small>示例餐饮 · 万达店</small>${tag('跨服务跟进')}</div>${items.length?items.map(v=>`<button class="task-card" data-act="go:riskdetail"><div class="split"><small>${v[0]} · 鼠类风险</small>${tag(v[3])}</div><h3 style="font-size:15px">${v[1]}</h3><p>${v[2]}</p><div class="bottom"><span>${v[4]}</span><span>查看跟进 ›</span></div></button>`).join(''):`<div class="empty-state">${I('shield')}<h3>暂无已关闭风险</h3><p>复核通过后，风险将归入这里。</p></div>`}<p class="note">服务完成不会自动关闭风险。每次服务请记录跟进情况或未核查原因。</p></div>`,nav:'risks',back:false}},
riskdetail(g){return {title:'整改跟进',body:`<div class="inner"><div class="split">${tag('建筑结构')}${tag(state.fields.riskState||'待整改','dark')}</div><h2 style="font-size:20px;margin:14px 0 8px">穿墙孔洞封堵不严</h2><p class="muted" style="font-size:12px">万达店 · 后区三楼 · 鼠类风险</p>${photos(['原始风险照片'])}<div class="panel">${kv('发现时间','2026-10-11')}${kv('责任方','门店工程负责人')}${kv('整改期限','2026-11-13')}<p>建议对孔洞进行封堵，完成后提供改善照片。</p></div>${title('跟进记录')}<div class="timeline"><div class="timeline-item"><strong>11月11日 · 本次复核</strong><p>当前仍未封堵，已再次与门店沟通。</p></div><div class="timeline-item"><strong>10月11日 · 首次发现</strong><p>新增风险并指派门店跟进。</p></div></div>${select('本次跟进结果','riskResult',['未改善','整改中','提交复核','复核通过','复核不通过','本次未核查'],'未改善')}${area('跟进说明','riskNote','孔洞仍存在，门店计划安排工程封堵。')}${title('改善 / 跟进照片')}${photos(['本次跟进照片'])}</div>`,footer:action('保存跟进','risk-followup'),back:'risks'}},
newrisk(g){return {title:'新增风险',body:`<div class="inner">${select('风险类型 *','newRiskType',['建筑结构','卫生清洁','设施管理','外部环境','其他'],'建筑结构')}${select('关联虫害','newRiskPest',['鼠类','蟑螂','飞虫','其他'],'鼠类')}<div class="number-grid">${select('区域 *','newRiskArea',['后区','客区','仓库'],'后区')}${field('楼层','newRiskFloor','三楼')}</div>${field('具体位置 *','newRiskLocation','配电柜上方穿墙孔洞')}${area('风险描述 *','newRiskDesc','穿墙孔洞未完全封堵，存在鼠类进入通道。')}${title('风险照片','至少1张')}${photos(['风险现场'])}${area('建议改进措施','newRiskAdvice','使用适当材料封堵孔洞，完成后复核。')}${field('整改责任方','responsible','门店工程负责人')}${field('计划完成日期','dueDate','2026-11-13','','date')}<p class="hint">未发现虫体也可以登记环境风险。</p></div>`,footer:action('保存风险','risk-save'),back:'risks'}},
treatment(g){const chemical=(state.fields.treatmentType||'清洁处理')==='药剂处理';return {title:'防治措施',body:`<div class="inner"><div class="panel"><small>关联来源</small><h2 style="margin-top:8px">I0001 · 灭蝇灯捕获</h2><p>蝇类 1 · 果蝇等 2 · 其他 12</p></div>${select('处置措施 *','treatmentType',['清洁处理','结构封堵','设施调整','物理捕杀','药剂处理','观察复查','本次未处置'],'清洁处理')}${field('处理位置 *','treatmentLocation','后区清洁池及排水口')}${chemical?`${select('药剂名称 *','drug',['请选择公司已配置药剂'],'请选择公司已配置药剂')}<div class="number-grid">${field('配比浓度','concentration','','按实际记录')}${field('施用量','dose','','按实际记录','number')}</div>${select('用量口径','doseType',['原药用量','配制液用量','单位面积用量'],'原药用量')}${field('单位','unit','','请选择或填写单位')}<p class="hint">原型不提供药剂及剂量建议。</p>`:area('处理说明 *','treatmentText','清理清洁池底部残渣，对排水口周边进行清洁，并更换粘捕耗材。')}${title('现场留证')}${photos(['处置前','处置后'])}${area('下次关注事项','nextFocus','下次检查清洁池周边飞虫活动及卫生保持情况。')}<p class="hint">本次未处置时须填写原因，不能只记录虫情。</p></div>`,footer:action('保存措施','save:summary'),back:'detail'}},
summary(g){return {title:'服务总结',body:`<div class="inner"><div class="panel"><div class="split"><h2>提交前检查</h2>${tag('8 / 8 已核对')}</div><div class="row"><span class="circle done">${I('check')}</span><span class="main"><strong>作业记录与照片</strong><small>设施点检、风险跟进已保存</small></span></div><div class="row"><span class="circle done">${I('check')}</span><span class="main"><strong>虫情处置已关联</strong><small>发现记录均有措施或原因</small></span></div><button class="row" data-act="go:static"><span class="circle done">${I('check')}</span><span class="main"><strong>静态评估已确认</strong><small>本次门店环境已核对，可查看修改</small></span>${I('chevron','chevron')}</button></div>${area('本次服务总结 *','summary','本次检查设施9处，发现飞虫活动并完成清洁处理。复核历史风险7条，仍需门店配合完成结构封堵。')}${area('客户需配合事项','customerAction','安排工程人员封堵三楼穿墙孔洞；加强清洁池与排水口周边卫生。')}${segment('天气情况','weather',['晴','多云','雨','其他'],'多云')}<div class="panel">${kv('到店时间','09:06')}${kv('当前服务时长','42分钟')}${kv('尚未关闭风险','7条 · 持续跟进')}</div><p class="hint">总结由员工核对后确认；签字后更改内容需要重新签字。</p></div>`,footer:goBtn('核对报告并签字','staffsign'),back:'detail'}},
report(g){return {title:'报告预览',body:`<div class="strip">${I('file')}<span class="strip-text">${state.published?'已发布正式报告':'待签字确认 · 尚未发布正式报告'}</span></div><div class="inner"><div class="report-paper"><h2>综合虫害管理服务报告</h2><p class="report-no">PC-4273-20261111 · V1</p><table class="mini-table"><tbody><tr><th>门店</th><td>示例餐饮 · 万达店</td></tr><tr><th>服务</th><td>常规服务 · 陈工</td></tr><tr><th>日期</th><td>2026-11-11 09:06</td></tr></tbody></table><h3>一 服务总结</h3><p>完成设施检查与现场处理。发现7条未关闭风险，需门店配合完成结构封堵与卫生改善。</p><h3>二 虫情来源分别统计</h3><table class="mini-table"><thead><tr><th>来源</th><th>飞虫</th><th>其他</th></tr></thead><tbody><tr><td>客户反馈</td><td>15</td><td>数量不明</td></tr><tr><td>现场发现</td><td>未发现</td><td>未发现</td></tr><tr><td>设施捕获</td><td>10</td><td>38</td></tr></tbody></table><h3>三 风险与设施明细</h3><p>建筑结构风险5条，卫生清洁风险2条。粘鼠板4处，蟑螂设施3处，灭蝇灯2处。</p>${photos(['风险照片','改善照片'],false)}<h3>四 处置记录与静态评估</h3><p>已记录清洁处理、耗材更换及门店环境情况。详细内容随本次服务记录保存。</p><div class="signature-grid"><div><div class="signature-box">${state.staffSigned?'员工已签字':'服务方签字'}</div><p class="report-caption">服务方确认</p></div><div><div class="signature-box">${state.customerSigned?'客户已签字':'客户签字'}</div><p class="report-caption">客户方确认</p></div></div></div><p class="hint center">此页为白模版式示意，报告按实际内容自动分页。</p></div>`,footer:action(g?'阅读后返回确认（5秒）':`阅读后返回确认（${reviewRemaining}秒）`,'review-done','btn primary','id="review-button" disabled'),back:reportReturn}},
staffsign(g){return {title:'员工确认与签字',body:`<div class="inner">${serviceName()}<div class="panel" style="margin-top:18px">${kv('服务人员','陈工')}${kv('服务日期','2026-11-11')}${kv('内容版本','V1 · 当前服务')}${goBtn('查看本次报告','report','btn full small')}</div><label class="checkline"><input type="checkbox" id="staff-declare" checked><span>本人已核对服务记录，确认所填内容与现场情况一致。</span></label>${title('员工手写签字')}${signature('员工',g)}<p class="note">签字后更改作业内容，将生成新版本并要求重新确认。</p><div class="panel" style="margin-top:20px"><div class="split"><small>下一步</small>${tag('客户现场确认')}</div><p>请客户先查看报告，再填写姓名并签字。</p></div></div>`,footer:action('确认签字并交客户确认','staff-sign'),back:'summary'}},
clientsign(g){return {title:'客户现场确认',body:`<div class="inner"><div class="panel">${serviceName()}<p>请先阅读本次服务报告，确认内容后签字。</p>${action(reviewed?'已阅读 · 再次查看报告':'查看完整报告（至少5秒）','go:report','btn full small')}</div>${field('客户姓名 *','customerName','','请输入现场确认人姓名')}<label class="checkline"><input type="checkbox" id="customer-read"><span>我已阅读报告，并确认本次服务内容。</span></label>${title('服务评价','选填，不默认评分')}<div class="stars" aria-label="总体评价">${[1,2,3,4,5].map(n=>`<button data-rating="${n}" aria-label="${n}星" class="${n<=state.rating?'selected':''}">${n<=state.rating?'★':'☆'}</button>`).join('')}</div>${title('客户手写签字')}${signature('客户',g)}${field('其他意见（选填）','feedbackOpinion','','请输入意见或建议')}<div class="split"><small>客户不在场或不便签字？</small>${action('登记原因','refuse','btn text small')}</div></div>`,footer:action('确认签字并提交','customer-sign'),back:'staffsign'}},
sync(g){return {title:'同步中心',right:action('查看帮助','sync-help','link-action'),body:`<div class="inner"><div class="sync-big"><span class="square">${I('sync')}</span><div><strong>${state.published?'全部已同步':state.offline?'离线 · 等待同步':'2项记录待同步'}</strong><small>未同步的资料将保留在本机</small></div></div><div class="strip">${I(state.offline?'download':'wifi')}<span class="strip-text">${state.offline?'当前无网络连接，联网后自动重试':'网络已连接，可立即同步待上传记录'}</span></div>${title('本次服务')}<div class="panel"><div class="split"><h2 style="font-size:15px">示例餐饮 · 万达店</h2>${tag(state.published?'已同步':'待同步')}</div><p>2026-11-11 · 常规服务</p><div class="progress"><span style="width:${state.published?'100':'65'}%"></span></div>${kv('作业数据',state.published?'已同步':'已保存')}${kv('现场照片',state.published?'18 / 18 已上传':'12 / 18 已上传')}${kv('双方签字',state.customerSigned?'已完成':'待完成')}${kv('正式报告',state.published?'已发布':'尚未生成')}</div>${title('异常记录','需人工处理')}<div class="panel"><div class="split"><strong style="font-size:14px">示例商超 · 老城店</strong>${tag('任务已改派','dashed')}</div><p>离线期间任务执行人发生变化，现场资料已保留，不会自动发布报告。</p>${action('查看处理说明','conflict','btn full small')}</div><p class="note">数据完整、双方签字有效且报告生成成功后，服务才会标记为已完成。</p></div>`,footer:action(state.offline?'等待联网':'立即同步','sync-now','btn primary',state.offline?'disabled':''),back:'home'}},

profile(g){return {title:'我的',body:`<div class="inner"><div class="profile-head"><div class="avatar">陈</div><div><h2>陈工</h2><p>服务工程师 · 江阴服务组</p></div></div><div class="panel" style="padding:0 14px">${row('user','员工资料','工号 PC-008','',tag('在职'))}${row('shield','门店授权','12家门店 · 区域内服务','tasks')}${row('file','我的服务报告','查看历史服务与报告','reportdone')}</div><div class="panel" style="padding:0 14px">${row('sync','同步中心',state.published?'记录已同步':'2项待同步，1项需处理','sync')}${row('download','离线资料','已下载今日任务与必要资料','sync')}${row('bell','消息通知','派工变更与风险跟进','tasks')}</div><div class="panel" style="padding:0 14px">${row('file','使用须知与帮助','版本 V1.0','')}${row('shield','隐私与账号安全','设备内资料按员工账号隔离','')}</div>${action('退出登录','logout','btn full')}<p class="note center">未同步资料会保留<br/>其他账号无法查看当前账号的缓存</p></div>`,nav:'profile',back:false}},
};
function phone(id,gallery=false){const p=pages[id](gallery);return `<section class="phone" data-screen="${id}" aria-label="${routeMap[id].title}"><div class="statusbar"><span>09:41</span><div class="status-icons">${I('signal')}${I('wifi')}${I('battery')}</div></div>${id==='login'?'':`<header class="appbar ${p.back?'with-back':''}">${p.back?action(I('back'),'go:'+p.back,'back','aria-label="返回"'):''}<h1>${p.title}</h1>${p.right||'<span class="right-gap"></span>'}</header>`}<div class="phone-content">${p.body}</div>${p.footer?`<div class="app-footer">${p.footer}</div>`:''}${p.nav?bottomnav(p.nav):''}<div class="gesture"></div><div id="toast" class="toast" role="status" hidden></div></section>`}
function render(){clearInterval(reviewTimer);signatureDrawn=false;const r=routeMap[route];if(isGallery){const ids=params.get('ids')?.split(',').filter(i=>routeMap[i])||routes.map(r=>r[0]);document.getElementById('app').innerHTML=`<main class="gallery"><div class="gallery-head"><div><h1>虫害治理 App · 白模页面总览</h1><p>安卓员工端 / V1.0 / ${ids.length}个页面 / 黑白灰低保真</p></div><a class="outer-btn" href="index.html">进入交互原型</a></div><div class="gallery-grid">${ids.map(id=>`<article class="gallery-item"><h2><span>${String(routeMap[id].index).padStart(2,'0')}</span>${routeMap[id].title}</h2>${phone(id,true)}<p>${routeMap[id].rule}</p></article>`).join('')}</div><div class="gallery-foot">演示数据 · 页面用于需求与交互评审，未连接真实业务服务</div></main>`;return}
document.body.classList.toggle('standalone',standalone);const groups=[...new Set(routes.map(r=>r[2]))];document.getElementById('app').innerHTML=`<header class="shellbar"><div class="brand"><span class="brand-mark">P</span><div><h1>虫害治理 App</h1><p>WIREFRAME PROTOTYPE / V1.0</p></div></div><div class="bar-actions"><button class="outer-btn" data-act="toggle-offline">${state.offline?'模拟联网':'模拟断网'}</button><a class="outer-btn" href="?gallery=1">全部页面</a><button class="outer-btn dark" data-act="go:home">开始体验</button></div></header><div class="layout"><aside class="sidebar"><p class="side-caption">20 SCREENS / 安卓员工端</p>${groups.map(group=>`<section class="nav-group"><h2>${group}</h2>${routes.filter(r=>r[2]===group).map(r=>`<a class="screen-link ${route===r[0]?'active':''}" href="#${r[0]}"><span>${String(routeMap[r[0]].index).padStart(2,'0')}</span>${r[1]}</a>`).join('')}</section>`).join('')}<div class="side-footer">白模界面与交互评审<br/>页面中的业务数据均为示例<br/>未连接真实后台与设备</div></aside><main class="workspace"><div class="workspace-top"><div><div class="eyebrow">${r.group} / SCREEN ${String(r.index).padStart(2,'0')}</div><h2>${r.title}</h2><p>${r.desc}</p></div><span class="page-counter">${r.index} / 20</span><select class="ui-select" id="page-picker" aria-label="切换原型页面">${routes.map(v=>`<option value="${v[0]}" ${v[0]===route?'selected':''}>${String(routeMap[v[0]].index).padStart(2,'0')} ${v[1]}</option>`).join('')}</select></div><div class="preview-stage">${phone(route)}<aside class="annotation"><div class="meta">PAGE NOTES</div><h3>${r.desc}</h3><p>${r.rule}</p><div class="rule"><div class="meta">交互说明</div><p>点击页面按钮可切换步骤；输入内容自动保留在当前浏览器。</p><p>顶部可切换模拟网络状态，检查离线待同步表现。</p></div><div class="rule"><div class="meta">原型边界</div><p>此为可点击白模，拍照、定位、同步和报告发布均使用演示数据。</p><span class="anno-pill">390 × 844</span><span class="anno-pill">Android</span><span class="anno-pill">灰阶</span></div><div class="page-arrows">${action('上一页','prev','outer-btn')}${action('下一页','next','outer-btn')}</div></aside></div></main></div>`;
if(route==='report'){reviewRemaining=5;if(reviewed){updateReview(0)}else{updateReview(5);reviewTimer=setInterval(()=>{reviewRemaining--;updateReview(reviewRemaining);if(reviewRemaining<=0){reviewed=true;clearInterval(reviewTimer)}},1000)}}
if(route==='staffsign'||route==='clientsign')initSignature();}
function updateReview(n){const b=document.getElementById('review-button');if(b){b.disabled=n>0;b.textContent=n>0?`阅读后返回确认（${n}秒）`:'已阅读，返回确认'}}
function navigate(id){if(!routeMap[id])return;if(id==='report')reportReturn=(route==='staffsign'||route==='reportdone')?route:'clientsign';if(id===route){render();return}location.hash=id}
function toast(message){const t=document.getElementById('toast');if(!t)return;t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2600)}
function dialog(title,copy){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-copy').textContent=copy;document.getElementById('dialog').showModal()}
function initSignature(){const c=document.getElementById('signature-canvas');if(!c)return;let down=false;const ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#333';const point=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};c.addEventListener('pointerdown',e=>{down=true;signatureDrawn=true;document.getElementById('sign-guide').hidden=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))});c.addEventListener('pointermove',e=>{if(!down)return;ctx.lineTo(...point(e));ctx.stroke()});c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false)}
document.getElementById('dialog-close').addEventListener('click',()=>document.getElementById('dialog').close());
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field&&el.type!=='password'){state.fields[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;persist()}if(el.id==='task-search'){taskQuery=el.value;const pos=el.selectionStart;render();const next=document.getElementById('task-search');next.focus();next.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='page-picker')navigate(el.value);if(el.dataset.field){state.fields[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;persist();if(el.dataset.field==='treatmentType')render()}});
document.addEventListener('click',e=>{if(isGallery)return;const seg=e.target.closest('[data-seg]');if(seg){state.fields[seg.dataset.seg]=seg.dataset.value;persist();seg.parentElement.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b===seg);b.setAttribute('aria-pressed',String(b===seg))});return}const filter=e.target.closest('[data-filter]');if(filter){if(filter.dataset.filter==='task')taskFilter=filter.dataset.value;if(filter.dataset.filter==='risk')riskFilter=filter.dataset.value;if(filter.dataset.filter==='device')deviceFilter=filter.dataset.value;render();return}const rating=e.target.closest('[data-rating]');if(rating){state.rating=Number(rating.dataset.rating);persist();rating.parentElement.querySelectorAll('button').forEach(b=>{const yes=Number(b.dataset.rating)<=state.rating;b.classList.toggle('selected',yes);b.textContent=yes?'★':'☆'});return}const step=e.target.closest('[data-step]');if(step){const [key,d]=step.dataset.step.split(':');const inp=document.querySelector(`input[data-field="${key}"]`);inp.value=Math.max(0,Number(inp.value||0)+Number(d));state.fields[key]=inp.value;persist();return}const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;if(act.startsWith('go:'))return navigate(act.slice(3));if(act.startsWith('save:')){persist();navigate(act.slice(5));setTimeout(()=>toast('本次记录已保存'),40);return}if(act.startsWith('day:')){document.querySelectorAll('.day').forEach(b=>b.classList.toggle('current',b===el));toast('日期切换示意，展示当前演示任务');return}
switch(act){case'login':if(state.offline)return toast('首次登录需要网络连接');navigate('home');break;case'help':dialog('联系管理员','账号、密码和门店权限由公司管理员统一维护。原型中可直接进入工作台体验。');break;case'notice':dialog('通知','暂无新的派工变更。可在任务列表查看今日服务，在风险台账跟进整改。');break;case'toggle-offline':state.offline=!state.offline;persist();render();toast(state.offline?'已切换为离线演示，资料保留在本机':'已切换为联网演示，可在同步中心重试');break;case'emergency':dialog('新增应急服务','选择已授权门店、虫害类型、服务日期和说明后创建应急任务。本轮白模复用任务详情展示后续作业。');break;case'new-device':dialog('新增设施','新增记录需填写设施类型、区域、具体位置和门店内编号。保存后进入逐点检查清单。');break;case'photo':{const button=el.closest('.photo');if(button){const item=document.createElement('div');item.innerHTML=photo('新增照片');button.before(item.firstChild)}toast('已添加照片占位示意，未调用相机');break}case'checkin':state.checkedIn=true;persist();navigate('intake');break;case'device-save':state.deviceSaved=true;persist();navigate('devices');setTimeout(()=>toast('点检记录已保存'),40);break;case'risk-save':state.riskSaved=true;persist();navigate('risks');setTimeout(()=>toast('风险记录已保存，进入持续跟进'),40);break;case'risk-followup':state.fields.riskState=state.fields.riskResult==='复核通过'?'已关闭':state.fields.riskResult==='提交复核'?'待复核':'整改中';persist();render();toast('本次跟进已保存');break;case'clear-sign':{const c=document.getElementById('signature-canvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);signatureDrawn=false;const guide=document.getElementById('sign-guide');if(guide)guide.hidden=false;break}case'staff-sign':if(!document.getElementById('staff-declare')?.checked)return toast('请先确认服务记录真实准确');if(!signatureDrawn)return toast('请在签字区域手写签名');state.staffSigned=true;persist();navigate('clientsign');break;case'review-done':if(!reviewed)return;reviewed=true;navigate(reportReturn);break;case'customer-sign':if(!state.staffSigned)return toast('请先完成员工签字');if(!reviewed)return toast('请先打开报告并阅读至少5秒');if(!(state.fields.customerName||'').trim())return toast('请填写客户姓名');if(!document.getElementById('customer-read')?.checked)return toast('请确认已阅读并认可本次服务内容');if(!signatureDrawn)return toast('请在签字区域手写签名');state.customerSigned=true;persist();navigate('sync');break;case'refuse':dialog('客户缺席或拒签','实际产品需记录原因并保持待确认，不能代签或发布正式报告。原型演示中，您可以返回任务保留当前记录。');break;case'sync-help':dialog('同步与发布','记录先保存在本机。联网后上传数据、照片和签字；校验成功并生成PDF后，服务才会标记为已完成。');break;case'conflict':dialog('任务改派冲突','现场资料已保留。由主管确认任务归属及记录版本后处理，系统不会覆盖其他员工的作业或自动发布报告。');break;case'sync-now':if(state.offline)return toast('当前离线，联网后可重试');if(!state.staffSigned||!state.customerSigned)return toast('请先完成员工与客户双方签字');el.disabled=true;el.textContent='同步中…';setTimeout(()=>{state.published=true;persist();navigate('reportdone')},900);break;case'amend':dialog('报告更正','正式报告不可覆盖。更正将创建新版本，保留原报告，并要求员工和客户重新确认签字。');break;case'share':dialog('分享正式报告','实际App会调用安卓系统分享。此白模展示分享入口，未生成或发送真实服务报告。');break;case'logout':navigate('login');break;case'prev':navigate(routes[Math.max(0,routeMap[route].index-2)][0]);break;case'next':navigate(routes[Math.min(routes.length-1,routeMap[route].index)][0]);break;}}
);
window.addEventListener('hashchange',()=>{route=location.hash.slice(1);if(!routeMap[route])route='home';render()});
render();
</script>
