components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        description: 同一操作所有重试复用，作用域为账号+设备+方法+规范化路径
        maxLength: 36
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        description: GET返回的强ETag，例 "draft-7"；缺失428，不匹配412
        maxLength: 2000
  responses:
    Error:
      description: 统一错误格式，详见错误码表
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    TaskStatus:
      type: string
      description: 服务业务状态
      maxLength: 2000
      enum:
      - PENDING
      - IN_PROGRESS
      - AWAITING_CONFIRMATION
      - COMPLETED
      - CANCELLED
    RiskStatus:
      type: string
      description: 风险状态，与服务状态独立
      maxLength: 2000
      enum:
      - PENDING
      - IN_PROGRESS
      - AWAITING_REVIEW
      - CLOSED
    ReportStatus:
      type: string
      description: 报告状态
      maxLength: 2000
      enum:
      - DRAFT
      - QUEUED
      - FAILED
      - PUBLISHED
      - SUPERSEDED
    LocalSyncStatus:
      type: string
      description: 仅客户端保存；不得用作服务完成依据
      maxLength: 2000
      enum:
      - LOCAL_ONLY
      - PENDING
      - SYNCING
      - FAILED
      - SYNCED
    ModuleState:
      type: string
      description: 模块状态
      maxLength: 2000
      enum:
      - UNFILLED
      - DRAFT
      - COMPLETE
      - NOT_APPLICABLE
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          description: JSON Pointer 或请求字段路径
          maxLength: 2000
        code:
          type: string
          description: 机器可识别错误码
          maxLength: 2000
        message:
          type: string
          description: 面向操作人的提示
          maxLength: 2000
        resourceId:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
        currentRevision:
          type: integer
          description: 当前版本
          minimum: 0
        retryable:
          type: boolean
          description: ''
      description: ''
      required:
      - path
      - code
      - message
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              description: ''
              maxLength: 2000
            message:
              type: string
              description: ''
              maxLength: 2000
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
              description: ''
              minItems: 0
              maxItems: 5000
            retryable:
              type: boolean
              description: ''
          description: ''
          required:
          - code
          - message
          - details
          - retryable
        requestId:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
      description: ''
      required:
      - error
      - requestId
    Location:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          description: 纬度
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: 经度
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          description: 定位精度 米
          minimum: 0
        provider:
          type: string
          description: 定位来源
          maxLength: 2000
          enum:
          - GPS
          - NETWORK
          - MANUAL
        capturedAt:
          type: string
          description: 带时区的 RFC3339 时间；示例 2026-11-11T09:06:00+08:00
          maxLength: 40
          format: date-time
      description: ''
      required:
      - latitude
      - longitude
      - accuracyMeters
      - provider
      - capturedAt
    Quantity:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          description: EXACT时value必填，可为0；UNKNOWN时不传value
          maxLength: 2000
          enum:
          - EXACT
          - UNKNOWN
        value:
          type: integer
          description: 明确数量
          minimum: 0
          maximum: 1000000000
      description: ''
      required:
      - kind
      allOf:
      - if:
          properties:
            kind:
              const: EXACT
        then:
          required:
          - value
        else:
          not:
            required:
            - value
    AttachmentRef:
      type: object
      additionalProperties: false
      properties:
        attachmentId:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 小写十六进制
        mediaType:
          type: string
          description: 文件真实类型
          maxLength: 2000
          enum:
          - image/jpeg
          - image/png
          - application/pdf
        sizeBytes:
          type: integer
          description: 原始字节数
          minimum: 1
      description: ''
      required:
      - attachmentId
      - sha256
      - mediaType
      - sizeBytes
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
        companyId:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
        employeeCode:
          type: string
          description: ''
          maxLength: 2000
        name:
          type: string
          description: ''
          maxLength: 80
        roles:
          type: array
          items:
            type: string
            description: ''
            maxLength: 2000
            enum:
            - EMPLOYEE
            - DISPATCHER
            - SUPERVISOR
            - ADMIN
          description: ''
          minItems: 0
          maxItems: 5000
        permissions:
          type: array
          items:
            type: string
            description: ''
            maxLength: 2000
          description: ''
          minItems: 0
          maxItems: 5000
        teamName:
          type: string
          description: ''
          maxLength: 100
        regionIds:
          type: array
          items:
            type: string
            description: 客户端生成 UUID v4；首次生成后不得因重试改变
            maxLength: 36
            format: uuid
          description: ''
          minItems: 0
          maxItems: 5000
        permissionVersion:
          type: integer
          description: ''
          minimum: 0
      description: ''
      required:
      - id
      - companyId
      - employeeCode
      - name
      - roles
      - permissions
      - permissionVersion
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        companyCode:
          type: string
          description: ''
          maxLength: 40
        account:
          type: string
          description: ''
          maxLength: 100
        password:
          type: string
          description: ''
          maxLength: 256
          writeOnly: true
        deviceId:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
        appVersion:
          type: string
          description: ''
          maxLength: 40
      description: ''
      required:
      - companyCode
      - account
      - password
      - deviceId
      - appVersion
    Session:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: ''
          maxLength: 8192
        refreshToken:
          type: string
          description: ''
          maxLength: 8192
        tokenType:
          type: string
          description: ''
          maxLength: 2000
          enum:
          - Bearer
        accessExpiresAt:
          type: string
          description: 带时区的 RFC3339 时间；示例 2026-11-11T09:06:00+08:00
          maxLength: 40
          format: date-time
        refreshExpiresAt:
          type: string
          description: 带时区的 RFC3339 时间；示例 2026-11-11T09:06:00+08:00
          maxLength: 40
          format: date-time
        sessionId:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
        user:
          $ref: '#/components/schemas/User'
      description: ''
      required:
      - accessToken
      - refreshToken
      - tokenType
      - accessExpiresAt
      - refreshExpiresAt
      - sessionId
      - user
    RefreshInput:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: ''
          maxLength: 8192
          writeOnly: true
        deviceId:
          type: string
          description: 客户端生成 UUID v4；首次生成后不得因重试改变
          maxLength: 36
          format: uuid
      description: ''
      required:
      - refreshToken
      - deviceId
    Ack:
      type: object
      additionalProperties: false
      properties:
        isAccepted:
          type: boolean
          description: ''
        receivedAt:
          type: string
          description: 带时区的 RFC3339 时间；示例 2026-11-11T09:06:00+08:00
          maxLength: 40
          format: date-time
      description: ''
      required:
      - isAccepted
      - receivedAt
    AppConfig:
      type: object
      additionalProperties: false
      properties:
        configVersion:
          type: string
          description: ''
          maxLength: 2000
        recommendedMinutes:
          type: integer
          description: 建议服务时长，初始30
          minimum: 1
        previewMinSeconds:
          type: integer
          description: 首期5秒
          minimum: 5
        maxImageBytes:
          type: integer
          description: ''
          minimum: 0
        maxDocumentBytes:
          type: integer
          description: ''
          minimum: 0
        maxSubmissionBytes:
          type: integer
          description: ''
          minimum: 0
        uploadSessionTtlSeconds:
          type: integer
          description: ''
          minimum: 0
        offlineGrantHours:
          type: integer
          description: 需要公司确认的授权有效期
          minimum: 0
        maxOfflineTasks:
          type: integer
          description: ''
          minimum: 0
        supportContact:
          type: string
          description: ''
          maxLength: 2000
        privacyVersion:
          type: string
          description: ''
          maxLength: 2000
        termsVersion:
          type: string
