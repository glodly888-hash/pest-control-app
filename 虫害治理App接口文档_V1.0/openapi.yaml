openapi: 3.1.0
info:
  title: 虫害治理App员工端接口
  version: 1.0.0-draft
  description: 基于20页白模及V1.0需求的设计契约。未部署后端。base URL为占位；接口/字段/错误码需评审后冻结。
servers:
- url: https://api.example.invalid/api/v1
  description: 占位地址，联调前替换
security:
- bearerAuth: []
tags:
- name: 账号
- name: 基础
- name: 任务
- name: 管理依赖
- name: 门店
- name: 现场
- name: 风险
- name: 离线
- name: 签字报告
- name: 附件
paths:
  /auth/sessions:
    post:
      operationId: login
      summary: 账号登录
      tags:
      - 账号
      description: 公司编号用于定位登录主体，不提供多公司入驻。首次登录需联网；错误不暴露账号是否存在。
      x-roles:
      - PUBLIC
      parameters: []
      responses:
        '201':
          description: 成功；详见接口语义
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  requestId:
                    type: string
                    description: 客户端生成 UUID v4；首次生成后不得因重试改变
                    maxLength: 36
                    format: uuid
                description: ''
                required:
                - data
                - requestId
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /auth/refreshes:
    post:
      operationId: refresh
      summary: 刷新令牌
      tags:
      - 账号
      description: 轮换refresh token并绑定deviceId；短暂重复请求使用相同refresh token应返回同一会话结果或确定性错误，不创建并行刷新链。
      x-roles:
      - PUBLIC
      parameters: []
      responses:
        '200':
          description: 成功；详见接口语义
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
