    delete:
      operationId: logout
      summary: 退出当前设备会话
      tags:
      - 账号
      description: 幂等撤销当前会话；本地未同步资料保留在原账号加密区，其他账号不能读取。
      x-roles:
      - EMPLOYEE
      - DISPATCHER
      - SUPERVISOR
      - ADMIN
      parameters: []
      responses:
