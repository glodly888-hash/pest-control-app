                    type: string
                    description: 客户端生成 UUID v4；首次生成后不得因重试改变
                    maxLength: 36
                    format: uuid
                description: ''
                required:
                - data
                - requestId
          headers:
            ETag:
              description: 强ETag，例 "draft-7" 或 "task-3"
              schema:
                type: string
                description: ''
                maxLength: 2000
        '400':
          $ref: '#/components/responses/Error'
        '401':
