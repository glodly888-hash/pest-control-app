          type: string
          description: 客户签字必填
          maxLength: 36
          format: uuid
        rating:
          type: integer
          description: 选填，不填表示未评价
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: ''
          maxLength: 1000
        attestationHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 按签字章节约定，对除本字段外的整个SignatureInput做JCS摘要
        supersedesSignatureId:
          type: string
          description: 替换尚未发布快照的旧签署凭证时填写
          maxLength: 36
          format: uuid
        replacementReason:
          type: string
          description: 替换签署凭证的原因
          maxLength: 1000
      description: ''
      required:
      - id
      - role
      - snapshotId
      - contentHash
      - signerName
      - signatureImage
      - signedAt
      - deviceId
      - isAcknowledged
      - attestationHash
      dependentRequired:
        supersedesSignatureId:
        - replacementReason
        replacementReason:
        - supersedesSignatureId
      allOf:
      - if:
          properties:
            role:
              const: STAFF
        then:
          required:
          - staffUserId
          not:
            anyOf:
            - required:
              - rating
            - required:
              - comment
            - required:
              - previewSessionId
            - required:
              - staffSignatureId
      - if:
          properties:
            role:
              const: CUSTOMER
        then:
          required:
          - staffSignatureId
          - previewSessionId
          not:
            required:
            - staffUserId
