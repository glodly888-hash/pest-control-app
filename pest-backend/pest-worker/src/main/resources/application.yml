# 虫害治理 App 后端 Worker 进程配置（骨架）
spring:
  application:
    name: pest-worker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pest?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:pest_dev_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration

# 应用私有配置
pest:
  media:
    # 报告 PDF 对象键根目录（与 API 附件 upload-root 同根，生产换对象存储）
    report-root: ${REPORT_ROOT:/tmp/pest-media}
  worker:
    # 队列轮询间隔（毫秒）
    poll-delay-ms: ${WORKER_POLL_DELAY_MS:2000}
    # 租约时长（秒）
    lease-seconds: ${WORKER_LEASE_SECONDS:60}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
