# 虫害治理 App 后端 API 进程配置
# 注意：以下为开发默认值，凭据一律走环境变量，不写入源码或提交仓库
spring:
  application:
    name: pest-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pest?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:pest_dev_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产结构变更以新增版本执行，不改已执行的 V001

# 应用私有配置
pest:
  jwt:
    # 开发默认 secret（>=32 字节），生产必须用环境变量覆盖
    secret: ${JWT_SECRET:pest-dev-secret-key-change-me-in-production-0123456789}

server:
  port: 8080
  servlet:
    # 统一 API 前缀，与 openapi 契约的 /api/v1 对齐（54 项接口均以此为根）
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
